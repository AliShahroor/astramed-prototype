<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <meta name="theme-color" content="#0b1115" />
    <meta
      name="description"
      content="ASTRAMED — explainable astronaut health monitoring. A synthetic-data prototype by Team Code Blue."
    />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%icon.svg" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <title>ASTRAMED · Mission health</title>
  </head>
  <body>
    <!-- Mission environment backdrop: one 4K layer per environment, cross-faded via [data-env] on <html>. -->
    <div class="envbg" aria-hidden="true">
      <div class="envbg__layer envbg--mars"></div>
      <div class="envbg__layer envbg--orbit"></div>
      <div class="envbg__layer envbg--moon"></div>
      <div class="envbg__layer envbg--earth"></div>
      <div class="envbg__scrim"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
